name: kernels

#  kernel CI：在 ubuntu 上用 mlir-aie 编译 AIE kernel（XDNA2 目标）。
#  本机（Windows）负责 xclbin 组装（xclbinutil，免装 XRT）+ 上机实测。
#  触发：kernels/ 下源码变更时自动编译，artifact 供本机 gh 拉取。

on:
  push:
    paths: ['kernels/**', '.github/workflows/kernels.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mlir-aie toolchain
        run: |
          python3 -m pip install --upgrade pip
          pip install mlir_aie -f https://github.com/Xilinx/mlir-aie/releases/expanded_assets/latest-wheels-4
          pip install llvm-aie -f https://github.com/Xilinx/llvm-aie/releases/expanded_assets/nightly
          python3 -c "from aie.iron import Kernel; print('IRON OK')"
          # mlir_aie wheel 不含 Peano；llvm-aie wheel 装在 platlib/llvm-aie
          LOC=$(pip show llvm-aie | awk '/^Location:/{print $2}')
          echo "PEANO_INSTALL_DIR=$LOC/llvm-aie" >> $GITHUB_ENV
          ls "$LOC/llvm-aie/bin" | head

      - name: Build xbf3_gemv (emit MLIR + peano + aiecc, no xclbinutil)
        run: |
          set -x
          cd kernels/xbf3_gemv
          mkdir -p build work
          # 1) design MLIR
          python3 xbf3_gemv.py --emit-mlir > work/aie.mlir
          # 2) core kernel .o (Peano, aie2p)
          "$PEANO_INSTALL_DIR/bin/clang++" --target=aie2p-none-unknown-elf -O2 \
            -c xbf3_gemv.cc -o work/xbf3_gemv_chunk.o
          # 3) aiecc: insts + PDI + metadata jsons（xclbin 组装留给本机 xclbinutil）
          AIECC=$(python3 -c "from aie.tools import MLIR_AIE_BIN_DIR as b; print(b)")/aiecc
          "$AIECC" --no-compile-host --no-xchesscc --no-xbridge --peano="$PEANO_INSTALL_DIR" \
            work/aie.mlir \
            --aie-generate-npu-insts --npu-insts-name=insts.bin \
            --aie-generate-pdi --pdi-name=design.pdi \
            --aie-generate-xclbin --xclbin-name=xbf3_gemv.xclbin \
            --tmpdir=work --verbose 2>&1 | tail -30 || true
          cp work/insts.bin work/design.pdi build/ 2>/dev/null || true
          echo "=== work/ ==="; ls -la work/
          echo "=== build/ ==="; ls -la build/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernels-xclbin
          path: |
            kernels/xbf3_gemv/build/**
            kernels/xbf3_gemv/work/**
          if-no-files-found: ignore
