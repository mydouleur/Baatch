name: kernels

#  kernel CI：在 ubuntu 上用 mlir-aie 编译 AIE kernel（XDNA2 目标）。
#  本机（Windows）只负责上机实测；编译全部走 CI。
#  触发：kernels/ 下源码变更时自动编译，artifact 供本机 gh 拉取。

on:
  push:
    paths: ['kernels/**', '.github/workflows/kernels.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mlir-aie toolchain
        run: |
          python3 -m pip install --upgrade pip
          pip install mlir_aie -f https://github.com/Xilinx/mlir-aie/releases/expanded_assets/latest-wheels-4
          pip install llvm-aie -f https://github.com/Xilinx/llvm-aie/releases/expanded_assets/nightly
          python3 -c "from aie.iron import Kernel; print('IRON OK')"
          # Peano (llvm-aie) 安装位置探测：mlir-aie 的 peano_install_dir 只认
          # $PEANO_INSTALL_DIR 或 platlib/llvm-aie，wheel 实际布局可能不同
          LOC=$(pip show llvm-aie | awk '/^Location:/{print $2}')
          CLANG=$(find "$LOC" -maxdepth 4 -name "clang++" | head -1)
          echo "clang++ found at: $CLANG"
          PEANO_DIR=$(dirname "$(dirname "$CLANG")")
          echo "PEANO_INSTALL_DIR=$PEANO_DIR" >> $GITHUB_ENV
          echo "peano dir: $PEANO_DIR"

      - name: Build xbf3_gemv (compile-only, npu2)
        run: |
          cd kernels/xbf3_gemv
          python3 xbf3_gemv.py --xclbin-path build/xbf3_gemv.xclbin --insts-path build/insts.bin
          ls -la build/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernels-xclbin
          path: |
            kernels/**/*.xclbin
            kernels/**/*.bin
            kernels/**/*.elf
            kernels/**/build/**
          if-no-files-found: ignore
