name: kernels

#  kernel CI：在 ubuntu 上用 mlir-aie 编译 AIE kernel（XDNA2 目标）。
#  本机（Windows）负责 xclbin 组装（xclbinutil，免装 XRT）+ 上机实测。
#  触发：kernels/ 下源码变更时自动编译，artifact 供本机 gh 拉取。

on:
  push:
    paths: ['kernels/**', '.github/workflows/kernels.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mlir-aie toolchain
        run: |
          python3 -m pip install --upgrade pip
          pip install mlir_aie -f https://github.com/Xilinx/mlir-aie/releases/expanded_assets/latest-wheels-4
          pip install llvm-aie -f https://github.com/Xilinx/llvm-aie/releases/expanded_assets/nightly
          python3 -c "from aie.iron import Kernel; print('IRON OK')"
          # mlir_aie wheel 不含 Peano；llvm-aie wheel 装在 platlib/llvm-aie
          LOC=$(pip show llvm-aie | awk '/^Location:/{print $2}')
          echo "PEANO_INSTALL_DIR=$LOC/llvm-aie" >> $GITHUB_ENV

      - name: Build kernels (emit-mlir + peano + aiecc; xclbin 组装在本机)
        run: |
          set -x
          cd kernels/xbf3_gemv
          AIECC=$(python3 -c "from aie.tools import MLIR_AIE_BIN_DIR as b; print(b)")/aiecc
          build_one() {  # $1=design.py $2=tag; rest=extra design args
            local py=$1 tag=$2; shift 2
            mkdir -p build_$tag work_$tag
            python3 $py --emit-mlir "$@" > work_$tag/aie.mlir
            "$PEANO_INSTALL_DIR/bin/clang++" --target=aie2p-none-unknown-elf -O2 \
              -c xbf3_gemv.cc -o work_$tag/xbf3_gemv_chunk.o
            cp work_$tag/xbf3_gemv_chunk.o work_$tag/xbf3_discard_chunk.o
            cp work_$tag/xbf3_gemv_chunk.o work_$tag/xbf3_gemv_chunk3.o
            cp work_$tag/xbf3_gemv_chunk.o work_$tag/xbf3_discard_chunk3.o
            cp work_$tag/xbf3_gemv_chunk.o work_$tag/xbf3_load_act.o
            "$AIECC" --no-compile-host --no-xchesscc --no-xbridge --peano="$PEANO_INSTALL_DIR" \
              work_$tag/aie.mlir \
              --aie-generate-npu-insts --npu-insts-name=build_$tag/insts.bin \
              --aie-generate-pdi --pdi-name=build_$tag/design.pdi \
              --aie-generate-xclbin --xclbin-name=build_$tag/unused.xclbin \
              --tmpdir=work_$tag --verbose 2>&1 | tail -80 || true
            ls -la build_$tag/
          }
          build_one xbf3_gemv_v3.py v3_discard --core discard --experts 64 --ncols 4
          build_one xbf3_gemv_v3.py v3_scalar --core scalar --experts 64 --ncols 4
          echo "=== done ==="

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernels-xclbin
          path: |
            kernels/xbf3_gemv/build*/**
            kernels/xbf3_gemv/work*/**
          if-no-files-found: ignore
