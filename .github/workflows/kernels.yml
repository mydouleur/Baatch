name: kernels

#  kernel CI：在 ubuntu 上用 mlir-aie 编译 AIE kernel（XDNA2 目标）。
#  本机（Windows）负责 xclbin 组装（xclbinutil，免装 XRT）+ 上机实测。
#  触发：kernels/ 下源码变更时自动编译，artifact 供本机 gh 拉取。

on:
  push:
    paths: ['kernels/**', '.github/workflows/kernels.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mlir-aie toolchain
        run: |
          python3 -m pip install --upgrade pip
          pip install mlir_aie -f https://github.com/Xilinx/mlir-aie/releases/expanded_assets/latest-wheels-4
          pip install llvm-aie -f https://github.com/Xilinx/llvm-aie/releases/expanded_assets/nightly
          python3 -c "from aie.iron import Kernel; print('IRON OK')"
          # mlir_aie wheel 不含 Peano；llvm-aie wheel 装在 platlib/llvm-aie
          LOC=$(pip show llvm-aie | awk '/^Location:/{print $2}')
          echo "PEANO_INSTALL_DIR=$LOC/llvm-aie" >> $GITHUB_ENV

      - name: Build kernels (emit-mlir + peano + aiecc; xclbin 组装在本机)
        run: |
          set -x
          cd kernels/xbf3_gemv
          AIECC=$(python3 -c "from aie.tools import MLIR_AIE_BIN_DIR as b; print(b)")/aiecc
          AIE_INC=$(python3 -c "from aie.utils import config; print(config.cxx_header_path())")
          ls "$AIE_INC" | head -3
          BP_FLAGS="-std=c++20 -D__AIE_API_AIE_ADF_HPP__ -Wno-macro-redefined -Wno-unknown-attributes -I$AIE_INC"
          compile_objs() {  # $1 = work dir, $2 = chunk rows for bp kernels
            local w=$1 cr=${2:-128}
            "$PEANO_INSTALL_DIR/bin/clang++" --target=aie2p-none-unknown-elf -O2               -c xbf3_gemv.cc -o $w/xbf3_gemv_chunk.o
            "$PEANO_INSTALL_DIR/bin/clang++" --target=aie2p-none-unknown-elf -O2               -c xbf3_gemv.cc -o $w/xbf3_discard_chunk.o
            "$PEANO_INSTALL_DIR/bin/clang++" --target=aie2p-none-unknown-elf -O2               -c xbf3_v3_gemv.cc -DCHUNK_ROWS_C=128 -o $w/xbf3_gemv_chunk3.o
            "$PEANO_INSTALL_DIR/bin/clang++" --target=aie2p-none-unknown-elf -O2               -c xbf3_v3_gemv.cc -DCHUNK_ROWS_C=128 -o $w/xbf3_discard_chunk3.o
            "$PEANO_INSTALL_DIR/bin/clang++" --target=aie2p-none-unknown-elf -O2               -c xbf3_v3_load.cc -DCHUNK_ROWS_C=128 -o $w/xbf3_load_act.o
            "$PEANO_INSTALL_DIR/bin/clang++" --target=aie2p-none-unknown-elf -O2 $BP_FLAGS               -c xbf3_bp.cc -DCHUNK_ROWS_C=$cr -o $w/xbf3_gemv_chunk4.o
            "$PEANO_INSTALL_DIR/bin/clang++" --target=aie2p-none-unknown-elf -O2 $BP_FLAGS               -c xbf3_bp.cc -DCHUNK_ROWS_C=$cr -o $w/xbf3_discard_chunk4.o
            "$PEANO_INSTALL_DIR/bin/clang++" --target=aie2p-none-unknown-elf -O2 $BP_FLAGS               -c xbf3_bp_load.cc -o $w/xbf3_load_act4.o
            "$PEANO_INSTALL_DIR/bin/clang++" --target=aie2p-none-unknown-elf -O2 $BP_FLAGS               -c xbf3_bp.cc -DCHUNK_ROWS_C=$cr -o $w/xbf3_debug4.o
            "$PEANO_INSTALL_DIR/bin/clang++" --target=aie2p-none-unknown-elf -O2 $BP_FLAGS               -c xbf3_bp.cc -DCHUNK_ROWS_C=$cr -o $w/xbf3_extract_only4.o
            "$PEANO_INSTALL_DIR/bin/clang++" --target=aie2p-none-unknown-elf -O2 $BP_FLAGS               -c xbf3_bp.cc -DCHUNK_ROWS_C=$cr -o $w/xbf3_mac_only4.o
            "$PEANO_INSTALL_DIR/bin/clang++" --target=aie2p-none-unknown-elf -O2 $BP_FLAGS               -c xbf3_bps.cc -DCHUNK_ROWS_C=$cr -o $w/xbf3_gemv_chunk6.o
            "$PEANO_INSTALL_DIR/bin/clang++" --target=aie2p-none-unknown-elf -O2 $BP_FLAGS               -c xbf3_bps.cc -DCHUNK_ROWS_C=$cr -o $w/xbf3_discard_chunk6.o
            "$PEANO_INSTALL_DIR/bin/clang++" --target=aie2p-none-unknown-elf -O2 $BP_FLAGS               -c xbf3_bps_load.cc -o $w/xbf3_load_act6.o
            "$PEANO_INSTALL_DIR/bin/clang++" --target=aie2p-none-unknown-elf -O2 $BP_FLAGS               -c xbf3_vsel.cc -DCHUNK_ROWS_C=$cr -o $w/xbf3_gemv_chunk7.o
            "$PEANO_INSTALL_DIR/bin/clang++" --target=aie2p-none-unknown-elf -O2 $BP_FLAGS               -c xbf3_vsel.cc -DCHUNK_ROWS_C=$cr -o $w/xbf3_discard_chunk7.o
            "$PEANO_INSTALL_DIR/bin/clang++" --target=aie2p-none-unknown-elf -O2 $BP_FLAGS               -c xbf3_vsel_load.cc -o $w/xbf3_load_act7.o
          }
          build_one() {  # $1=design.py $2=tag; rest=extra design args
            local py=$1 tag=$2; shift 2
            mkdir -p build_$tag work_$tag
            python3 $py --emit-mlir "$@" > work_$tag/aie.mlir
            compile_objs work_$tag ${CR:-128}
            "$AIECC" --no-compile-host --no-xchesscc --no-xbridge --peano="$PEANO_INSTALL_DIR"               work_$tag/aie.mlir               --aie-generate-npu-insts --npu-insts-name=build_$tag/insts.bin               --aie-generate-pdi --pdi-name=build_$tag/design.pdi               --aie-generate-xclbin --xclbin-name=build_$tag/unused.xclbin               --tmpdir=work_$tag --verbose 2>&1 | tail -80 || true
            ls -la build_$tag/
          }
          build_one xbf3_gemv_v4.py v4_scalar --core scalar --experts 64 --ncols 4
          build_one xbf3_gemv_v6.py v6_scalar --core scalar --experts 64 --ncols 4
          build_one xbf3_gemv_v7.py v7_scalar --core scalar --experts 64 --ncols 4
          build_one xbf3_gemv_v7.py v7_discard --core discard --experts 64 --ncols 4
          build_one xbf3_gemv_v4.py v4_discard --core discard --experts 64 --ncols 4
          build_one xbf3_gemv_v4.py v4_extract_only --core extract_only --experts 64 --ncols 4
          build_one xbf3_gemv_v4.py v4_mac_only --core mac_only --experts 64 --ncols 4
          CR=64 build_one xbf3_gemv_v5.py v5_discard --core discard --experts 64 --ncols 4 --chunk-rows 64 --l2-rows 256
          build_one xbf3_gemv_v5.py v5_discard8 --core discard --experts 64 --ncols 8 --chunk-rows 64 --l2-rows 256
          build_one xbf3_gemv_v4.py v4_discard8 --core discard --experts 64 --ncols 8
          build_one xbf3_gemv_v4.py v4_scalar8 --core scalar --experts 64 --ncols 8
          build_one xbf3_gemv_v5.py v5_scalar8 --core scalar --experts 64 --ncols 8 --chunk-rows 64 --l2-rows 256
          CR=64 build_one xbf3_gemv_v5.py v5_scalar --core scalar --experts 64 --ncols 4 --chunk-rows 64 --l2-rows 256
          echo "=== done ==="

      - name: Build npu_w4_gemv (W4A16 GEMV, TileFuse 结构 + Peano)
        run: |
          set -x
          pip install ml_dtypes
          # w4 设计/内核按 TileFuse（main 时代）API 写——升级到 mlir_aie 1.4.4
          #（1.3.4 的 aie_api 在 aie2p bf16 GEMV 路径上有实测数值 bug，±5/±7 触发）
          pip install --upgrade --no-deps mlir_aie==1.4.4 -f https://github.com/Xilinx/mlir-aie/releases/expanded_assets/v1.4.4
          python3 -c "import aie; print('mlir_aie', getattr(aie, '__version__', 'n/a'))"
          cd kernels/npu_w4_gemv
          AIECC=$(python3 -c "from aie.tools import MLIR_AIE_BIN_DIR as b; print(b)")/aiecc
          AIE_INC=$(python3 -c "from aie.utils import config; print(config.cxx_header_path())")
          mkdir -p work
          "$PEANO_INSTALL_DIR/bin/clang++" --target=aie2p-none-unknown-elf -O2 -std=c++20             -D__AIE_API_AIE_ADF_HPP__ -Wno-macro-redefined -Wno-unknown-attributes -I"$AIE_INC"             -DDIM_N=64 -DDIM_K=128 -c vm_mix_int4_64x8.cc -o work/vm_64x128.o
          for SZ in 4096 8192; do
            mkdir -p build_$SZ work_$SZ
            cp work/vm_64x128.o work_$SZ/
            python3 vector_matrix.py --dev npu2 -N $SZ -K $SZ > work_$SZ/aie.mlir
            "$AIECC" --no-compile-host --no-xchesscc --no-xbridge --peano="$PEANO_INSTALL_DIR"               work_$SZ/aie.mlir --aie-generate-npu-insts --npu-insts-name=build_$SZ/insts.bin               --aie-generate-pdi --pdi-name=build_$SZ/design.pdi               --aie-generate-xclbin --xclbin-name=build_$SZ/unused.xclbin               --tmpdir=work_$SZ --verbose 2>&1 | tail -40 || true
            ls -la build_$SZ/
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernels-xclbin
          path: |
            kernels/xbf3_gemv/build*/**
            kernels/xbf3_gemv/work*/**
            kernels/npu_w4_gemv/build*/**
            kernels/npu_w4_gemv/work*/**
          if-no-files-found: ignore
