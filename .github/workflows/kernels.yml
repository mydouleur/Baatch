name: kernels

#  kernel CI：在 ubuntu 上用 mlir-aie 编译 AIE kernel（XDNA2 目标）。
#  本机（Windows）只负责上机实测；编译全部走 CI。
#  触发：kernels/ 下源码变更时自动编译，artifact 供本机 gh 拉取。

on:
  push:
    paths: ['kernels/**', '.github/workflows/kernels.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mlir-aie toolchain
        run: |
          python3 -m pip install --upgrade pip
          pip install mlir_aie -f https://github.com/Xilinx/mlir-aie/releases/expanded_assets/latest-wheels-4
          pip install -r <(echo "ml_dtypes") 2>/dev/null || true
          python3 -c "from aie.iron import Kernel; print('IRON OK')"

      - name: Smoke build (passthrough example)
        run: |
          echo "TODO: 第一个自研 kernel (kernels/xbf3_gemv) 落地后替换为正式构建"
          echo "当前仅验证工具链可用性"
          || which aie-opt aie-translate || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernels-xclbin
          path: |
            kernels/**/*.xclbin
            kernels/**/*.elf
          if-no-files-found: ignore
